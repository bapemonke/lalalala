<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Maalkin Day 🍦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #ffb6d9;
    --pink-deep: #ff6fa5;
    --mint: #b6f2e6;
    --lavender: #d9c9ff;
    --cream: #fff8ef;
    --choco: #6b4226;
    --gold: #ffd166;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Fredoka', sans-serif;
    background: linear-gradient(180deg, var(--lavender) 0%, var(--pink) 45%, var(--mint) 100%);
    overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap{
    position:relative;
    width:100%; height:100dvh;
    display:flex; flex-direction:column; align-items:center;
  }

  /* ---- header ---- */
  header{
    text-align:center;
    padding:14px 12px 6px;
    z-index:5;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(24px, 6vw, 42px);
    color: var(--pink-deep);
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(107,66,38,0.15);
    margin: 0;
    letter-spacing: 0.5px;
  }
  h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: clamp(16px, 3.6vw, 24px);
    color: var(--choco);
    margin: 4px 0 0;
    opacity: 0.85;
  }

  /* ---- hud ---- */
  #hud{
    display:flex; gap:18px; align-items:center; justify-content:center;
    margin-top:6px; z-index:5;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
  }
  .pill{
    background: rgba(255,255,255,0.75);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: clamp(14px, 3vw, 18px);
    color: var(--choco);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  /* ---- game area ---- */
  #gameArea{
    position:relative;
    flex:1;
    width:100%;
    max-width: 560px;
    margin-top: 4px;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:none;
  }

  #startScreen, #endScreen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    gap:14px;
    z-index:10;
    padding: 24px;
  }
  #endScreen{ display:none; }

  .bigBtn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: clamp(18px, 4.5vw, 24px);
    color:#fff;
    background: linear-gradient(135deg, var(--pink-deep), #ff8fb8);
    border:none;
    border-radius: 999px;
    padding: 14px 36px;
    box-shadow: 0 6px 0 #d94f86, 0 8px 14px rgba(0,0,0,0.15);
    cursor:pointer;
    transition: transform .08s ease;
  }
  .bigBtn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #d94f86; }

  #startScreen p, #endScreen p{
    font-size: clamp(14px, 3.6vw, 18px);
    color: var(--choco);
    max-width: 340px;
    margin:0;
  }

  #endMessage{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(22px, 6vw, 34px);
    color: var(--pink-deep);
    background: rgba(255,255,255,0.85);
    border-radius: 24px;
    padding: 22px 26px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    max-width: 90%;
    line-height: 1.35;
  }

  footer{
    font-family:'Baloo 2';
    font-size: 12px;
    color: var(--choco);
    opacity:0.55;
    padding: 6px 0 10px;
    z-index:5;
  }

  @keyframes floatUp{
    from{ transform: translateY(0) scale(1); opacity:1; }
    to{ transform: translateY(-40px) scale(1.3); opacity:0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>Happy Maalkin Day Babris 🍦</h1>
    <h2>Happy Maalkin Day</h2>
  </header>

  <div id="hud">
    <div class="pill">Score: <span id="scoreVal">0</span></div>
    <div class="pill">Time: <span id="timeVal">30</span>s</div>
    <div class="pill">Lives: <span id="livesVal">3</span>❤️</div>
  </div>

  <div id="gameArea">
    <canvas id="game"></canvas>

    <div id="startScreen">
      <div style="font-size:56px;">🍦🍧🍨</div>
      <p>Move the cone with your mouse, finger, or arrow keys.<br>
      Catch the sweet treats, dodge the spicy ones!</p>
      <button class="bigBtn" id="startBtn">Start the game</button>
    </div>

    <div id="endScreen">
      <div id="endMessage">Kal tumhare liye ice cream aa jayegi babris ❤️</div>
      <button class="bigBtn" id="restartBtn">Play again</button>
    </div>
  </div>

  <footer>made with love, one scoop at a time 🍦</footer>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const gameArea = document.getElementById('gameArea');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');
  const startBtn = document.getElementById('startBtn');
  const restartBtn = document.getElementById('restartBtn');
  const scoreVal = document.getElementById('scoreVal');
  const timeVal = document.getElementById('timeVal');
  const livesVal = document.getElementById('livesVal');

  let W, H, DPR;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    W = gameArea.clientWidth;
    H = gameArea.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);

  const GOOD = ['🍦','🍨','🍧','🧁','🍬','🍩'];
  const BAD = ['🌶️','🧅','🧄'];

  let cone = { x: 0, w: 70, h: 60 };
  let items = [];
  let score = 0, lives = 3, timeLeft = 30;
  let running = false;
  let spawnTimer = 0;
  let lastTime = 0;
  let pointerX = null;
  let particles = [];

  function resetGame(){
    resize();
    cone.x = W/2;
    items = [];
    particles = [];
    score = 0; lives = 3; timeLeft = 30;
    scoreVal.textContent = score;
    livesVal.textContent = lives;
    timeVal.textContent = timeLeft;
    spawnTimer = 0;
  }

  function spawnItem(){
    const isBad = Math.random() < 0.22;
    const emoji = isBad
      ? BAD[Math.floor(Math.random()*BAD.length)]
      : GOOD[Math.floor(Math.random()*GOOD.length)];
    items.push({
      x: 20 + Math.random()*(W-40),
      y: -30,
      size: 34 + Math.random()*10,
      speed: 90 + Math.random()*70 + (30 - timeLeft),
      emoji,
      bad: isBad
    });
  }

  function update(dt){
    timeLeft -= dt;
    if (timeLeft <= 0){ timeLeft = 0; endGame(); }
    timeVal.textContent = Math.ceil(timeLeft);

    spawnTimer -= dt;
    if (spawnTimer <= 0){
      spawnItem();
      spawnTimer = 0.55 + Math.random()*0.4;
    }

    for (let i = items.length-1; i>=0; i--){
      const it = items[i];
      it.y += it.speed * dt;

      const coneTop = H - cone.h - 6;
      if (it.y + it.size/2 > coneTop && it.y - it.size/2 < H - 6 &&
          Math.abs(it.x - cone.x) < cone.w/2 + it.size/3){
        if (it.bad){
          lives -= 1;
          livesVal.textContent = lives;
          spawnParticle(it.x, it.y, '💥');
          if (lives <= 0){ items.splice(i,1); endGame(); continue; }
        } else {
          score += 1;
          scoreVal.textContent = score;
          spawnParticle(it.x, it.y, '+1');
        }
        items.splice(i,1);
        continue;
      }
      if (it.y > H + 40) items.splice(i,1);
    }

    for (let i = particles.length-1; i>=0; i--){
      particles[i].life -= dt;
      particles[i].y -= 40*dt;
      if (particles[i].life <= 0) particles.splice(i,1);
    }
  }

  function spawnParticle(x,y,text){
    particles.push({x,y,text,life:0.6});
  }

  function drawCone(){
    ctx.save();
    ctx.translate(cone.x, H - 6);
    ctx.font = '54px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('🍦', 0, 4);
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // ground shadow
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(0, H-14, W, 14);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    items.forEach(it=>{
      ctx.font = it.size + 'px serif';
      ctx.fillText(it.emoji, it.x, it.y);
    });

    particles.forEach(p=>{
      ctx.globalAlpha = Math.max(p.life/0.6, 0);
      ctx.font = '20px "Baloo 2", sans-serif';
      ctx.fillStyle = p.text === '💥' ? '#e63946' : '#ff6fa5';
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    });

    drawCone();
  }

  function loop(ts){
    if (!running) return;
    if (!lastTime) lastTime = ts;
    const dt = Math.min((ts - lastTime)/1000, 0.05);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function startGame(){
    resetGame();
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    running = true;
    lastTime = 0;
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    endScreen.style.display = 'flex';
  }

  // pointer controls
  function setPointer(clientX){
    const rect = gameArea.getBoundingClientRect();
    pointerX = clientX - rect.left;
    cone.x = Math.max(cone.w/2, Math.min(W - cone.w/2, pointerX));
  }
  gameArea.addEventListener('mousemove', e => setPointer(e.clientX));
  gameArea.addEventListener('touchmove', e => {
    if (e.touches[0]) setPointer(e.touches[0].clientX);
    e.preventDefault();
  }, {passive:false});

  window.addEventListener('keydown', e=>{
    if (!running) return;
    if (e.key === 'ArrowLeft') cone.x = Math.max(cone.w/2, cone.x - 24);
    if (e.key === 'ArrowRight') cone.x = Math.min(W - cone.w/2, cone.x + 24);
  });

  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);

  resize();
  cone.x = W/2;
  draw();
})();
</script>
</body>
</html>
